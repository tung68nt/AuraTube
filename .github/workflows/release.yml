name: Release macOS app

# Push a tag like v2.1.9 after editing release.json (version, build, title, releaseNotes).
# The job builds a universal app (Apple Silicon + Intel), uploads DMG/ZIP to the GitHub
# release, and only then updates version.json on main so users never see an update
# whose files are not online yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.1.9)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          MANIFEST_VERSION=$(jq -r .version release.json)
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "release.json version ($MANIFEST_VERSION) does not match tag ($TAG)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write version.json for the build
        run: |
          V=${{ steps.v.outputs.version }}
          jq --arg url "https://github.com/${{ github.repository }}/releases/download/v$V/AuraTube-v$V.dmg" \
             --arg date "$(date -u +%Y-%m-%d)" \
             '. + {downloadUrl: $url, publishedAt: $date, minOSVersion: "13.0"}' release.json > version.json

      - name: Build universal app, DMG and ZIP
        env:
          SWIFT_BUILD_ARGS: "--arch arm64 --arch x86_64"
          APP_BINARY: ${{ github.workspace }}/AuraTubeNative/.build/apple/Products/Release/AuraTube
        run: |
          sudo mkdir -p /Applications && sudo chown "$USER" /Applications || true
          bash AuraTubeNative/package_dmg.sh
          lipo -info /Applications/AuraTube.app/Contents/MacOS/AuraTube
          /Applications/AuraTube.app/Contents/Resources/bin/yt-dlp --version

      - name: Smoke test yt-dlp format selection (with deno)
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/deno.zip https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip
          ditto -x -k /tmp/deno.zip /tmp/deno
          Y=/Applications/AuraTube.app/Contents/Resources/bin/yt-dlp
          $Y --js-runtimes deno:/tmp/deno/deno -s --no-playlist \
            -f "bestvideo[vcodec^=avc1][height<=1080]+bestaudio[ext=m4a]/bv*+ba/b" \
            "https://www.youtube.com/watch?v=jNQXAC9IVRw" || echo "::warning::yt-dlp smoke test failed (runner IP may be blocked by YouTube)"

      - name: Set file size in version.json
        run: |
          SIZE=$(du -m "AuraTube-v${{ steps.v.outputs.version }}.dmg" | awk '{printf "%.1f MB", $1}')
          jq --arg s "$SIZE" '.fileSize = $s' version.json > version.tmp && mv version.tmp version.json
          cat version.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          jq -r .releaseNotes version.json > notes.md
          gh release create "v$V" \
            "AuraTube-v$V.dmg" "AuraTube-v$V.zip" AuraTube.dmg AuraTube.zip \
            --title "$(jq -r .title version.json)" --notes-file notes.md --latest

      - name: Publish update manifest (version.json) to main
        run: |
          cp version.json /tmp/version.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/version.json version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore(release): v${{ steps.v.outputs.version }}"
          git push origin main

  desktop:
    # Electron build for Windows and Ubuntu, uploaded to the same GitHub release.
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ytdlp: yt-dlp.exe
            target: win
          - os: ubuntu-latest
            ytdlp: yt-dlp_linux
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bundle yt-dlp for ${{ matrix.target }}
        run: |
          mkdir -p bin
          OUT=bin/yt-dlp; [ "${{ matrix.target }}" = win ] && OUT=bin/yt-dlp.exe
          curl -fL --retry 3 -o "$OUT" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/${{ matrix.ytdlp }}"
          chmod +x "$OUT"
          "$OUT" --version

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          npm ci
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm run dist:${{ matrix.target }}
          ls dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          shopt -s nullglob
          gh release upload "$TAG" dist/*.exe dist/*.AppImage dist/*.deb --clobber

  linux-native:
    # Native GTK4/libadwaita build (AuraTubeLinux/). Runs next to the Electron Linux build
    # until that one is retired. Publishes version-linux.json only after the .deb is online.
    needs: release
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: AuraTubeLinux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          V="${TAG#v}"
          sed -i "0,/^version = .*/s//version = \"$V\"/" Cargo.toml
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build, bundle yt-dlp, package .deb
        run: |
          cargo build --release
          mkdir -p bin
          curl -fL --retry 3 -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x bin/yt-dlp && bin/yt-dlp --version
          cargo install cargo-deb --locked
          cargo deb --no-build
          cp target/debian/*.deb "../AuraTube-linux-v${{ steps.v.outputs.version }}-amd64.deb"

      - name: Upload to release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.v.outputs.tag }}" "AuraTube-linux-v${{ steps.v.outputs.version }}-amd64.deb" --clobber

      - name: Publish version-linux.json to main
        working-directory: .
        run: |
          V=${{ steps.v.outputs.version }}
          URL="https://github.com/${{ github.repository }}/releases/download/v$V/AuraTube-linux-v$V-amd64.deb"
          jq --arg url "$URL" --arg date "$(date -u +%Y-%m-%d)" \
             '{version, build, title, releaseNotes} + {downloadUrl: $url, publishedAt: $date}' release.json > /tmp/version-linux.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main && git checkout -B main origin/main
            cp /tmp/version-linux.json version-linux.json
            git add version-linux.json
            git diff --cached --quiet && exit 0
            git commit -m "chore(release): version-linux.json v$V"
            git push origin main && exit 0
            sleep 5
          done
          exit 1
